# Inference adapter for pretrained/epoch_3.pth; no training config changes.
# Class order: car, motorcycle, pedestrian. Assume pedestrian-only heatmap
# NMS exemption (index 2); mentor implementation is unavailable.
# Single keyframe, no radar, no GT input. Do not apply legacy Z correction
# until the retrained checkpoint center convention has been checked.
dataset_root: data/nuscenes_vf6_01_5hz_nav_calib
model:
  fuser:
    type: ConvFuser
    in_channels:
    - 80
    - 256
    out_channels: 256
  encoders:
    camera:
      backbone:
        init_cfg: null
  heads:
    object:
      test_cfg:
        heatmap_nms_exempt_class_ids:
        - 2
        nms_type: null
test_pipeline:
- type: LoadMultiViewImageFromFiles
  to_float32: true
- type: LoadPointsFromFile
  coord_type: LIDAR
  load_dim: ${load_dim}
  use_dim: ${use_dim}
  reduce_beams: ${reduce_beams}
  load_augmented: ${load_augmented}
- type: ImageAug3D
  final_dim: ${image_size}
  resize_lim: ${augment2d.resize[1]}
  bot_pct_lim:
  - 0.0
  - 0.0
  rot_lim:
  - 0.0
  - 0.0
  rand_flip: false
  is_train: false
- type: GlobalRotScaleTrans
  resize_lim:
  - 1.0
  - 1.0
  rot_lim:
  - 0.0
  - 0.0
  trans_lim: 0.0
  is_train: false
- type: PointsRangeFilter
  point_cloud_range: ${point_cloud_range}
- type: ImageNormalize
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
- type: DefaultFormatBundle3D
  classes: ${object_classes}
- type: Collect3D
  keys:
  - img
  - points
  meta_keys:
  - camera_intrinsics
  - camera2ego
  - lidar2ego
  - lidar2camera
  - camera2lidar
  - lidar2image
  - img_aug_matrix
  - lidar_aug_matrix
data:
  samples_per_gpu: 1
  workers_per_gpu: 0
  test:
    ann_file: ${dataset_root + "/bevfusion_infos_val.pkl"}
    load_interval: 1
    samples_per_gpu: 1
  val:
    ann_file: ${dataset_root + "/bevfusion_infos_val.pkl"}
    load_interval: 1
